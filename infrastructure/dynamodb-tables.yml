# CloudFormation template for the Football Pick'em DynamoDB tables.
#
# THIS FILE MUST MATCH THE DEPLOYED STACK football-pickem-dynamodb.
# Verify with:  aws cloudformation detect-stack-drift --stack-name football-pickem-dynamodb
#
# It supersedes three earlier templates. dynamodb-tables-simple.yml was what
# production was actually built from, but 5e1f636 deleted it as redundant,
# leaving the live stack described by no file in the repository.
# dynamodb-tables.yml and dynamodb-tables-optimized.yml both described
# aspirations rather than reality -- the latter declared 36 GSIs against the
# 18 that exist. Qualified names ('simple', 'optimized') are what allowed the
# repo and the account to drift apart, so there is now exactly one, plainly
# named, and it is authoritative.
#
# Reconciled against live state on 2026-09-08: added is_admin-index,
# game_id-user_id-index, football_game_id-index, user_game_football-index and
# game_email-index, all of which existed on the tables but in no template;
# dropped commissioner_id-index, which was declared here but never deployed
# and is referenced nowhere in the code.
#
# Every table carries DeletionPolicy/UpdateReplacePolicy: Retain. Do not
# remove them: without them a failed UPDATE_ROLLBACK destroys user data.

AWSTemplateFormatVersion: '2010-09-09'
Description: 'DynamoDB tables for Football Pick em application'

Parameters:
  Environment:
    Type: String
    Default: 'prod'
    Description: 'Environment name (dev, staging, prod)'
  
  TablePrefix:
    Type: String
    Default: 'football_pickem_'
    Description: 'Prefix for all table names'

Resources:
  # Users table
  UsersTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub '${TablePrefix}users'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: email
          AttributeType: S
        - AttributeName: is_admin
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: email-index
          KeySchema:
            - AttributeName: email
              KeyType: HASH
          Projection:
            ProjectionType: ALL
        - IndexName: is_admin-index
          KeySchema:
            - AttributeName: is_admin
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      Tags:
        - Key: Environment
          Value: !Ref Environment

  # Football Teams table
  FootballTeamsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub '${TablePrefix}football_teams'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: team_code
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: team_code-index
          KeySchema:
            - AttributeName: team_code
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      Tags:
        - Key: Environment
          Value: !Ref Environment

  # Pick'em Games table
  PickemGamesTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub '${TablePrefix}pickem_games'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: season_id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: season_id-index
          KeySchema:
            - AttributeName: season_id
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      Tags:
        - Key: Environment
          Value: !Ref Environment

  # Game Participants table
  GameParticipantsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub '${TablePrefix}game_participants'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: game_id
          AttributeType: S
        - AttributeName: user_id
          AttributeType: S
        - AttributeName: game_id_user_id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: game_id-index
          KeySchema:
            - AttributeName: game_id
              KeyType: HASH
          Projection:
            ProjectionType: ALL
        - IndexName: user_id-index
          KeySchema:
            - AttributeName: user_id
              KeyType: HASH
          Projection:
            ProjectionType: ALL
        - IndexName: game_id-user_id-index
          KeySchema:
            - AttributeName: game_id_user_id
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      Tags:
        - Key: Environment
          Value: !Ref Environment

  # Seasons table
  SeasonsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub '${TablePrefix}seasons'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: season
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: season-index
          KeySchema:
            - AttributeName: season
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      Tags:
        - Key: Environment
          Value: !Ref Environment

  # Football Games table
  FootballGamesTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub '${TablePrefix}football_games'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: season_id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: season_id-index
          KeySchema:
            - AttributeName: season_id
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      Tags:
        - Key: Environment
          Value: !Ref Environment

  # System Settings table
  SystemSettingsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub '${TablePrefix}system_settings'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      Tags:
        - Key: Environment
          Value: !Ref Environment

  # Picks table
  PicksTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub '${TablePrefix}picks'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: user_id
          AttributeType: S
        - AttributeName: game_id
          AttributeType: S
        - AttributeName: football_game_id
          AttributeType: S
        - AttributeName: user_game_football
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: user_id-index
          KeySchema:
            - AttributeName: user_id
              KeyType: HASH
          Projection:
            ProjectionType: ALL
        - IndexName: game_id-index
          KeySchema:
            - AttributeName: game_id
              KeyType: HASH
          Projection:
            ProjectionType: ALL
        - IndexName: football_game_id-index
          KeySchema:
            - AttributeName: football_game_id
              KeyType: HASH
          Projection:
            ProjectionType: ALL
        - IndexName: user_game_football-index
          KeySchema:
            - AttributeName: user_game_football
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      Tags:
        - Key: Environment
          Value: !Ref Environment

  # Weekly Standings table
  WeeklyStandingsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub '${TablePrefix}weekly_standings'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: user_id
          AttributeType: S
        - AttributeName: game_id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: user_id-index
          KeySchema:
            - AttributeName: user_id
              KeyType: HASH
          Projection:
            ProjectionType: ALL
        - IndexName: game_id-index
          KeySchema:
            - AttributeName: game_id
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      Tags:
        - Key: Environment
          Value: !Ref Environment

  # Game Invitations table
  GameInvitationsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub '${TablePrefix}game_invitations'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: game_id
          AttributeType: S
        - AttributeName: invite_token
          AttributeType: S
        - AttributeName: game_email
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: game_id-index
          KeySchema:
            - AttributeName: game_id
              KeyType: HASH
          Projection:
            ProjectionType: ALL
        - IndexName: invite_token-index
          KeySchema:
            - AttributeName: invite_token
              KeyType: HASH
          Projection:
            ProjectionType: ALL
        - IndexName: game_email-index
          KeySchema:
            - AttributeName: game_email
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      Tags:
        - Key: Environment
          Value: !Ref Environment

Outputs:
  UsersTableName:
    Description: 'Name of the Users table'
    Value: !Ref UsersTable
    Export:
      Name: !Sub '${AWS::StackName}-UsersTable'

  FootballTeamsTableName:
    Description: 'Name of the Football Teams table'
    Value: !Ref FootballTeamsTable
    Export:
      Name: !Sub '${AWS::StackName}-FootballTeamsTable'

  PickemGamesTableName:
    Description: 'Name of the Pickem Games table'
    Value: !Ref PickemGamesTable
    Export:
      Name: !Sub '${AWS::StackName}-PickemGamesTable'

  GameParticipantsTableName:
    Description: 'Name of the Game Participants table'
    Value: !Ref GameParticipantsTable
    Export:
      Name: !Sub '${AWS::StackName}-GameParticipantsTable'

  SeasonsTableName:
    Description: 'Name of the Seasons table'
    Value: !Ref SeasonsTable
    Export:
      Name: !Sub '${AWS::StackName}-SeasonsTable'

  FootballGamesTableName:
    Description: 'Name of the Football Games table'
    Value: !Ref FootballGamesTable
    Export:
      Name: !Sub '${AWS::StackName}-FootballGamesTable'

  SystemSettingsTableName:
    Description: 'Name of the System Settings table'
    Value: !Ref SystemSettingsTable
    Export:
      Name: !Sub '${AWS::StackName}-SystemSettingsTable'

  PicksTableName:
    Description: 'Name of the Picks table'
    Value: !Ref PicksTable
    Export:
      Name: !Sub '${AWS::StackName}-PicksTable'

  WeeklyStandingsTableName:
    Description: 'Name of the Weekly Standings table'
    Value: !Ref WeeklyStandingsTable
    Export:
      Name: !Sub '${AWS::StackName}-WeeklyStandingsTable'

  GameInvitationsTableName:
    Description: 'Name of the Game Invitations table'
    Value: !Ref GameInvitationsTable
    Export:
      Name: !Sub '${AWS::StackName}-GameInvitationsTable'

